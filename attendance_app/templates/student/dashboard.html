{% extends "base.html" %}

{% block title %}Student Dashboard{% endblock %}

{% block content %}
<div class="dashboard-container">
    <h1>Welcome, {{ user.full_name or user.username }}!</h1>
    <p>This is your student dashboard.</p>
    
    <div class="dashboard-cards">
        <div class="card">
            <h3>Attendance</h3>
            <p>Check your attendance records</p>
            <a href="{{ url_for('student.attendance') }}" class="btn">View</a>
        </div>
        <div class="card">
            <h3>Profile</h3>
            <p>View your profile and login information</p>
            <a href="{{ url_for('student.profile') }}" class="btn">View</a>
        </div>
    </div>
</div>
{% endblock %}
