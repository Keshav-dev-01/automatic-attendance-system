{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="dashboard-container">
    <h1>Welcome, Admin {{ user.full_name or user.username }}!</h1>
    <p>This is your admin dashboard.</p>
    
    <div class="dashboard-cards">
        <div class="card">
            <h3>Manage Users</h3>
            <p>Create, edit, and delete users</p>
            <a href="{{ url_for('admin.manage_users') }}" class="btn">Go</a>
        </div>
        <div class="card">
            <h3>Reports</h3>
            <p>View system reports and analytics</p>
            <a href="{{ url_for('admin.reports') }}" class="btn">Go</a>
        </div>
    </div>
</div>
{% endblock %}
